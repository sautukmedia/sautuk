name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', '.github/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Verify backend
        working-directory: backend
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test --runInBand
      - name: Verify frontend
        # These build artifacts are not deployed; Netlify supplies its live API URL.
        env:
          VITE_API_URL: https://api.example.test
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build
      - name: Verify deployment script syntax
        run: bash -n .github/scripts/deploy-backend.sh
      - name: Build production container
        run: docker build --target runner -t sautuk-backend:${{ github.sha }} backend

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy verified revision
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m
          script: |
            set -eu
            cd ~/sautuk
            git fetch origin main
            git checkout main
            git reset --hard '${{ github.sha }}'
            bash .github/scripts/deploy-backend.sh '${{ github.sha }}'
